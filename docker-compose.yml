version: "3.8"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      - remotion
    restart: unless-stopped
    volumes:
      - video-tmp:/tmp/video-editor
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  remotion:
    build:
      context: ./remotion-renderer
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3010:3010"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  dashboard:
    build:
      context: ./command-center
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    env_file: .env
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - AGENT_API_URL=http://agent:3002
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - agent
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  video-tmp:
