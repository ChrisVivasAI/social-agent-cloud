version: "3.8"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      - remotion
    restart: unless-stopped
    volumes:
      - video-tmp:/tmp/video-editor
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  remotion:
    build:
      context: ./remotion-renderer
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3010:3010"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  video-tmp:
